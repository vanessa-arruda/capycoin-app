services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capycoin
      POSTGRES_PASSWORD: capycoin
      POSTGRES_DB: capycoin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capycoin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./app-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://capycoin:capycoin@db:5432/capycoin
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app-backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
